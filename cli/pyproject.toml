[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nest"
version = "0.1.0"
description = "Nest — C++ CMake wrapper CLI"
readme = "README.md"
license = { text = "BSL-1.0" }
requires-python = ">=3.10"
authors = [
  { name = "ByBretema", email = "bybretema@gmail.com" },
]
keywords = ["cmake", "cpp", "build-tool", "ninja"]
classifiers = [
  "License :: OSI Approved :: Boost Software License 1.0 (BSL-1.0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/byBretema/nest"
Repository = "https://github.com/byBretema/nest"
Documentation = "https://github.com/byBretema/nest"

[project.scripts]
nest = "nest:main"

[tool.hatch.build.targets.wheel]
packages = ["nest"]
